# Every HUD panel color, keyed by semantic role — panels name a role, never a raw color. One
# unified family: deep blue-slate surfaces, warm amber for headers and focus, mint/rose for
# positive/negative status, sky cyan for informational accents.
[palette]
# Text hierarchy — every string a panel renders picks exactly one role.
textHeader = [240, 198, 92, 255] # active panel headers and titles
textPrimary = [230, 235, 243, 255] # primary readouts, button labels, card names
textSecondary = [156, 166, 184, 255] # secondary labels: descriptions, budgets, hints
textDisabled = [102, 110, 126, 255] # disabled button label text (backgrounds come from the widget style)
# Functional status accents, shared by every affordance of the same polarity.
statusPositive = [110, 212, 140, 255] # affordable cost, upgrade ready, sell value
statusNegative = [232, 93, 102, 255] # unaffordable cost, warn states
highlight = [255, 200, 87, 255] # focus: active toggles, tooltip border, level badges
accent = [108, 178, 230, 255] # informational accent: retarget label, category sub-headers, key capture
# Panel chrome.
panelBorder = [62, 72, 94, 255]
cardFill = [28, 33, 46, 200] # wave enemy card frame
cardBorder = [74, 86, 110, 255]
infinityGlyph = [108, 178, 230, 255] # status-bar endless-mode glyph
iconTint = [255, 255, 255, 255] # sprite tint for icon draws (build bar, datapack icons); white = untinted
panelBgRgb = [17, 20, 28, 255] # alpha is ignored; PanelBg() supplies it per call
eventTextRgb = [255, 214, 112, 255] # alpha is ignored; EventText() supplies it per call
screenDim = [8, 10, 16, 130]

[alpha]
window      = 220 # primary windows: Pause, TowerInfo, Wave (drawn with border)
docked      = 200 # docked bars: Status, Build (no border)
overlayBg   = 160 # ephemeral toast background before fade
overlayText = 220 # ephemeral toast text before fade
tooltipBg   = 235 # upgrade tooltip fill

[typography]
title       = 28.0 # modal title (PAUSED)
header      = 14.0 # panel headers, status readout
body        = 11.0 # descriptions, stat rows, card text
buttonLabel = 12.0 # button labels
small       = 8.0  # compact build-bar name/cost

# Full-screen menu/state typography and chrome (menu, settings, end, datapack-select).
# Unlike the HUD scale above, these are fixed sizes — full-screen states do not apply hudScale.
[state_ui]
title       = 40.0 # main-menu / datapack-select screen title
screenTitle = 48.0 # settings header and end-screen result title
menuButton  = 24.0 # menu / end / back button labels

# Harmonized with [palette]: same slate surfaces, amber accent, and rose negative.
[state_ui.colors]
# Screen-text hierarchy — every string a full-screen state renders picks one role
# (subtle below covers description subtitles, disabledText covers greyed labels).
title = [230, 235, 243, 255] # screen and dialog titles
textPrimary = [230, 235, 243, 255] # menu button labels, control labels and values
category = [240, 198, 92, 255] # section/category headers (AUDIO, BRUSH, PRESETS, ...)
# Surfaces and status
background = [26, 30, 40, 255] # full-screen clear
worldBg = [21, 24, 32, 255] # gameplay clear behind the map
dialogBg = [17, 20, 28, 245] # modal dialog panel fill
dialogOverlay = [8, 10, 16, 150] # screen dim behind a modal dialog
disabledText = [102, 110, 126, 255] # greyed action-button label text
warning = [255, 200, 87, 255] # conflict highlight, dialog border, editor warnings
placeholderBg = [22, 26, 36, 255] # missing-icon fill and scrollbar track
subtle = [156, 166, 184, 255] # description subtitles, hints, secondary text
victory = [255, 200, 87, 255] # end-screen win title
defeat = [232, 93, 102, 255] # end-screen loss title

# Selection screens (map / map-editor catalogs).
[state_ui.select]
autoCardTint = [40, 50, 68, 255] # procedural-map card's distinct thumbnail backing
thumbBg = [13, 15, 21, 255] # dark backing behind map preview thumbnails

# Map editor canvas and catalog. Tints that need transparency carry their alpha here.
[state_ui.map_editor]
deleteWarn = [240, 130, 80, 255] # delete-button label and failed-action status
canvasBg = [20, 23, 32, 255] # edit canvas backdrop
exportBg = [0, 0, 0, 255] # offscreen clear behind the exported map.png
grid = [230, 235, 243, 30] # translucent grid overlay lines
brushOutline = [230, 235, 243, 255] # hovered-tile outline around the brush ghost
# Translucent ghost tints per brush, harmonized with the palette accents.
brushGrass = [110, 212, 140, 130]
brushRock = [120, 128, 144, 130]
brushCore = [255, 200, 87, 150]
brushNest = [232, 93, 102, 150]
brushBuff = [108, 178, 230, 150]

# Particle editor preview and swatches.
[state_ui.particle_editor]
previewBg = [13, 15, 21, 255] # dark preview frame so bright particles read well
swatchBg = [13, 15, 21, 255] # backing under color swatches so low alpha stays readable

# Global widget styles, overlaid onto the engine defaults at load. Every Button/Slider/
# Toggle/TextInput drawn without an explicit style follows these.
[widgets.default]
bgNormal = [33, 38, 52, 255]
bgHovered = [47, 54, 72, 255]
bgInput = [22, 26, 36, 255]
bgActive = [110, 212, 140, 255] # toggle-on fill (matches statusPositive)
border = [62, 72, 94, 255] # matches panelBorder
borderSel = [255, 200, 87, 255] # selection border (matches highlight)
accent = [108, 178, 230, 255] # slider fill, focused input border (matches accent)
text = [230, 235, 243, 255] # matches textPrimary

[widgets.disabled]
bgNormal = [24, 27, 36, 200]
bgHovered = [24, 27, 36, 200]
bgInput = [18, 21, 29, 200]
bgActive = [30, 34, 46, 200]
border = [44, 50, 66, 255]
borderSel = [44, 50, 66, 255]
accent = [44, 50, 66, 255]
text = [102, 110, 126, 255] # matches textDisabled

# Shared, semantic layout anchors. Per-panel button heights, line heights, glyph/label offsets and
# toast padding are no longer knobs here — they are derived in code from the typographic scale
# (see "derived layout ratios" in src/hud/hud_theme.hpp).
[layout]
statusBarBaseH = 36.0 # unscaled height of the top status bar
wavePanelGap   = 6.0  # extra gap wave panel leaves below the status bar
marginBase     = 8.0  # default margin for every text panel
lineHBase      = 14.0 # default line height
headerHBase    = 20.0 # default header row height

[events]
maxEntries = 5   # maximum simultaneous event toast rows
fadeTime   = 1.0 # seconds over which toasts fade out

[panels.pause]
width       = 240.0
height      = 460.0
buttonWidth = 180.0

[panels.status]
waveButtonWidth  = 90.0
autoButtonWidth  = 48.0
wavesButtonWidth = 56.0
margin           = 6.0

[panels.wave]
width       = 200.0
cardGap     = 6.0
cardPadding = 6.0
iconSize    = 44.0

[panels.tower_build]
buttonSize  = 64.0
panelHeight = 80.0
gap         = 4.0

[panels.tower_info]
width       = 160.0
anchorGap   = 20.0
