# Font name per semantic text kind. Resolved as assets/fonts/<name>.{ttf,otf}, then a built-in
# ("EBGaramond"/"VictorMono"), else the body font. (Temporary: every kind forced to VictorMono.)
[fonts]
title   = "VictorMono" # menu title, victory / game-over banners
heading = "VictorMono" # section headers, panel titles
body    = "VictorMono" # general UI copy (the default kind)
label   = "VictorMono" # small captions / meta lines
number  = "VictorMono" # numeric readouts (gold, costs, levels)
button  = "VictorMono" # button captions
tooltip = "VictorMono" # tower / enemy description lines

# Unified semantic color roles, shared by every HUD panel and full-screen state. Surfaces step
# deep→up for contrast, a bright dedicated border frames panels, and action-oriented roles
# (status / highlight / accent) carry high-saturation hues for affordability, warnings and focus.
[palette]
textHeader     = [228, 214, 160, 255] # headers, titles, category sub-headers, event toasts
textPrimary    = [233, 238, 246, 255] # primary readouts, button labels, card names, dialog titles
textSecondary  = [162, 174, 196, 255] # descriptions, budgets, hints, subtitles
textDisabled   = [100, 110, 132, 255] # disabled label text
statusPositive = [84, 200, 120, 255]  # affordable cost, upgrade ready, sell value
statusNegative = [230, 80, 84, 255]   # unaffordable cost, warn/fail states, defeat title, delete
highlight      = [255, 194, 64, 255]  # focus: active toggles, tooltip/dialog border, badges, victory
accent         = [82, 168, 240, 255]  # informational accent: retarget, category headers, key capture
panelBorder    = [92, 106, 138, 255]  # panel / card / dialog borders and widget outlines
worldBg        = [22, 26, 38, 255]    # gameplay/state clear behind the map, placeholder fills
bgDark         = [12, 14, 22, 255]    # deepest backing: thumbnails, preview frames, swatch backs
screenDim      = [8, 10, 16, 165]     # full-screen dim behind the pause menu and modal dialogs
iconTint       = [255, 255, 255, 255] # sprite tint for icon draws; white = untinted
panelBgRgb     = [34, 40, 56, 255]    # panel fill base; alpha supplied per call by PanelBg()

# Panel-class opacities applied to the shared panel fill (PanelBg).
[alpha]
window      = 220 # primary windows: Pause, TowerInfo, Wave (drawn with border)
docked      = 200 # docked bars: Status, Build (no border); also the wave enemy card fill
overlayBg   = 160 # ephemeral toast background before fade
overlayText = 220 # ephemeral toast text before fade
tooltipBg   = 235 # upgrade tooltip fill
dialog      = 245 # modal dialog panel fill

# HUD typographic scale (unscaled bases; FontSize() applies hudScale).
[typography]
title       = 28.0 # modal title (PAUSED)
header      = 14.0 # panel headers, status readout
body        = 11.0 # descriptions, stat rows, card text
buttonLabel = 12.0 # button labels
small       = 8.0  # compact build-bar name/cost

# Full-screen state typography (fixed sizes — full-screen states do not apply hudScale). All other
# full-screen colors/surfaces route through [palette]; only genuinely state-specific cosmetics follow.
[state_ui]
title       = 40.0 # main-menu / datapack-select screen title
screenTitle = 48.0 # settings header and end-screen result title
menuButton  = 24.0 # menu / end / back button labels

# Selection screens: the procedural-map card's distinct thumbnail backing (preview thumbs use bgDark).
[state_ui.select]
autoCardTint = [59, 99, 61, 255] # forest green

# Map editor backdrops. Grid lines, brush ghosts and the tile outline derive from palette roles in code.
[state_ui.map_editor]
canvasBg = [38, 40, 55, 255] # edit canvas backdrop
exportBg = [0, 0, 0, 255]    # offscreen clear behind the exported map.png

# Shared semantic layout anchors (per-panel offsets are derived in code from the typographic scale).
[layout]
statusBarBaseH = 36.0 # unscaled height of the top status bar
wavePanelGap   = 6.0  # extra gap wave panel leaves below the status bar
marginBase     = 8.0  # default margin for every text panel
lineHBase      = 14.0 # default line height
headerHBase    = 20.0 # default header row height

# Event toast limits.
[events]
maxEntries = 5   # maximum simultaneous event toast rows
fadeTime   = 1.0 # seconds over which toasts fade out

# Per-panel unscaled geometry, one flat table; each key prefixed by its panel.
[panels]
pauseWidth             = 240.0
pauseHeight            = 460.0
pauseButtonWidth       = 180.0
statusWaveButtonWidth  = 90.0
statusAutoButtonWidth  = 48.0
statusWavesButtonWidth = 56.0
statusMargin           = 6.0
waveWidth              = 200.0
waveCardGap            = 6.0
waveCardPadding        = 6.0
waveIconSize           = 44.0
buildButtonSize        = 64.0
buildPanelHeight       = 80.0
buildGap               = 4.0
infoWidth              = 160.0
infoAnchorGap          = 20.0

# In-world enemy health bar (drawn by the render system, themed alongside the rest of the UI).
[health_bar]
width     = 20.0
height    = 4.0
padding   = 1.0
roundness = 0.2
segments  = 8
bgColor   = [40, 40, 40, 255]
