# One unified family of semantic color roles, shared by every HUD panel AND every full-screen
# state — panels and screens name a role, never a raw color. Deep blue-slate surfaces, warm amber
# for headers and focus, mint/rose for positive/negative status, sky cyan for informational accents.
[palette]
# Text hierarchy — every string a panel or screen renders picks exactly one role.
textHeader = [240, 198, 92, 255] # headers, titles, category sub-headers, event toasts
textPrimary = [230, 235, 243, 255] # primary readouts, button labels, card names, dialog titles
textSecondary = [156, 166, 184, 255] # secondary labels: descriptions, budgets, hints, subtitles
textDisabled = [102, 110, 126, 255] # disabled label text (backgrounds come from the widget style)
# Functional status accents, shared by every affordance of the same polarity.
statusPositive = [110, 212, 140, 255] # affordable cost, upgrade ready, sell value
statusNegative = [232, 93, 102, 255] # unaffordable cost, warn/fail states, defeat title, delete action
highlight = [255, 200, 87, 255] # focus: active toggles, tooltip/dialog border, badges, warnings, victory
accent = [108, 178, 230, 255] # informational accent: retarget label, category headers, key capture, infinity glyph
# Surfaces and chrome.
panelBorder = [62, 72, 94, 255] # panel / card / dialog borders and widget outlines
worldBg = [21, 24, 32, 255] # gameplay clear behind the map, full-screen state clear, placeholder fills
bgDark = [13, 15, 21, 255] # high-contrast dark backing: thumbnails, preview frames, swatch backs
screenDim = [8, 10, 16, 130] # full-screen dim behind the pause menu and modal dialogs
iconTint = [255, 255, 255, 255] # sprite tint for icon draws (build bar, datapack icons); white = untinted
panelBgRgb = [17, 20, 28, 255] # alpha is ignored; PanelBg() supplies it per call (panel/card/dialog fill)

[alpha]
window      = 220 # primary windows: Pause, TowerInfo, Wave (drawn with border)
docked      = 200 # docked bars: Status, Build (no border); also the wave enemy card fill
overlayBg   = 160 # ephemeral toast background before fade
overlayText = 220 # ephemeral toast text before fade
tooltipBg   = 235 # upgrade tooltip fill
dialog      = 245 # modal dialog panel fill — PanelBg(dialog)

[typography]
title       = 28.0 # modal title (PAUSED)
header      = 14.0 # panel headers, status readout
body        = 11.0 # descriptions, stat rows, card text
buttonLabel = 12.0 # button labels
small       = 8.0  # compact build-bar name/cost

# Full-screen menu/state typography and chrome (menu, settings, end, datapack-select).
# Unlike the HUD scale above, these are fixed sizes — full-screen states do not apply hudScale.
[state_ui]
title       = 40.0 # main-menu / datapack-select screen title
screenTitle = 48.0 # settings header and end-screen result title
menuButton  = 24.0 # menu / end / back button labels

# Full-screen states draw text, surfaces and status through the shared [palette] above: titles and
# menu labels use textPrimary, section headers textHeader, subtitles textSecondary, greyed labels
# textDisabled; the screen clear and placeholder fills use worldBg; warnings and the victory title
# use highlight, the defeat title statusNegative; the modal fill is PanelBg(dialog) and both the
# pause and modal dims use screenDim. Only genuinely state-specific cosmetics live below.

# Selection screens (map / map-editor catalogs). Preview thumbnails use the shared bgDark.
[state_ui.select]
autoCardTint = [40, 50, 68, 255] # procedural-map card's distinct thumbnail backing

# Map editor canvas and catalog. Tints that need transparency carry their alpha here.
# The delete-button label and failed-action status route through the shared statusNegative.
[state_ui.map_editor]
canvasBg = [20, 23, 32, 255] # edit canvas backdrop
exportBg = [0, 0, 0, 255] # offscreen clear behind the exported map.png
grid = [230, 235, 243, 30] # translucent grid overlay lines
brushOutline = [230, 235, 243, 255] # hovered-tile outline around the brush ghost
# Translucent ghost tints per brush, harmonized with the palette accents.
brushGrass = [110, 212, 140, 130]
brushRock = [120, 128, 144, 130]
brushCore = [255, 200, 87, 150]
brushNest = [232, 93, 102, 150]
brushBuff = [108, 178, 230, 150]

# Particle editor preview frames and color swatches both use the shared bgDark backing.

# Global widget styles (Button/Slider/Toggle/TextInput drawn without an explicit style) are derived
# in code from the palette above — see ApplyWidgetStyles() in src/hud/hud_theme.cpp — so they can
# never drift out of alignment with it. There is intentionally no [widgets.*] table here.

# Shared, semantic layout anchors. Per-panel button heights, line heights, glyph/label offsets and
# toast padding are no longer knobs here — they are derived in code from the typographic scale
# (see "derived layout ratios" in src/hud/hud_theme.hpp).
[layout]
statusBarBaseH = 36.0 # unscaled height of the top status bar
wavePanelGap   = 6.0  # extra gap wave panel leaves below the status bar
marginBase     = 8.0  # default margin for every text panel
lineHBase      = 14.0 # default line height
headerHBase    = 20.0 # default header row height

[events]
maxEntries = 5   # maximum simultaneous event toast rows
fadeTime   = 1.0 # seconds over which toasts fade out

[panels.pause]
width       = 240.0
height      = 460.0
buttonWidth = 180.0

[panels.status]
waveButtonWidth  = 90.0
autoButtonWidth  = 48.0
wavesButtonWidth = 56.0
margin           = 6.0

[panels.wave]
width       = 200.0
cardGap     = 6.0
cardPadding = 6.0
iconSize    = 44.0

[panels.tower_build]
buttonSize  = 64.0
panelHeight = 80.0
gap         = 4.0

[panels.tower_info]
width       = 160.0
anchorGap   = 20.0
